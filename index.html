<script>
var h = React.createElement;
var useState = React.useState;
var useEffect = React.useEffect;

var SB_URL = "https://bqnawfnkukcbqkujsskr.supabase.co";
var SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJxbmF3Zm5rdWtjYnFrdWpzc2tyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE1ODQ5NDAsImV4cCI6MjA4NzE2MDk0MH0.VeSr_1gEnsn3P0_cmQBcOkJNDpUe1rbIAD8E7nSbxQM";
var ADMIN_EMAIL = "joshua.grillet@proton.me";

function mkH(token){return{"apikey":SB_KEY,"Content-Type":"application/json","Authorization":"Bearer "+(token||SB_KEY)};}

function sbGet(path,token){return fetch(SB_URL+"/rest/v1/"+path,{headers:mkH(token)}).then(function(r){return r.json();});}
function sbPost(path,body,token){return fetch(SB_URL+"/rest/v1/"+path,{method:"POST",headers:Object.assign(mkH(token),{"Prefer":"return=representation"}),body:JSON.stringify(body)}).then(function(r){return r.json();});}
function sbPatch(path,body,token){return fetch(SB_URL+"/rest/v1/"+path,{method:"PATCH",headers:Object.assign(mkH(token),{"Prefer":"return=representation"}),body:JSON.stringify(body)}).then(function(r){return r.json();});}
function sbDel(path,token){return fetch(SB_URL+"/rest/v1/"+path,{method:"DELETE",headers:Object.assign(mkH(token),{"Prefer":"return=representation"})}).then(function(r){if(!r.ok)return r.json().then(function(e){throw new Error(e.message||e.error||"Erreur "+r.status);});return r.json();});}
function sbLoginPw(email,pw){return fetch(SB_URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:{"apikey":SB_KEY,"Content-Type":"application/json"},body:JSON.stringify({email:email,password:pw})}).then(function(r){return r.json();});}

var DIFFS=[{v:1,l:"Tr\u00e8s facile",m:"Calibre"},{v:2,l:"Facile",m:"Calibre"},{v:3,l:"Moyen",m:"Manufacture"},{v:4,l:"Difficile",m:"Manufacture"},{v:5,l:"Expert",m:"Haute Horlogerie"}];

var selS={padding:"10px 12px",background:C.card,border:"1px solid "+C.lt,borderRadius:0,color:C.fg,fontSize:12,fontFamily:font};

function loader(){return h("div",{style:{display:"flex",justifyContent:"center",padding:40}},h("div",{style:{width:20,height:20,border:"2px solid "+C.lt,borderTopColor:C.fg,borderRadius:"50%",animation:"spin 0.6s linear infinite"}}));}

function Admin(){
  var _qs=useState([]),qs=_qs[0],sQs=_qs[1];
  var _cats=useState([]),cats=_cats[0],sCats=_cats[1];
  var _v=useState("list"),v=_v[0],sV=_v[1];
  var _f=useState(empty()),f=_f[0],sF=_f[1];
  var _ei=useState(null),ei=_ei[0],sEi=_ei[1];
  var _fl=useState({cat:"all",diff:"all",search:""}),fl=_fl[0],sFl=_fl[1];
  var _t=useState(null),toast=_t[0],sT=_t[1];
  var _cf=useState(null),cf=_cf[0],sCf=_cf[1];
  var _ld=useState(false),ld=_ld[0],sLd=_ld[1];
  var _sv=useState(false),saving=_sv[0],sSv=_sv[1];

  function showT(m,err){sT({m:m,e:err});setTimeout(function(){sT(null);},2500);}

  function loadAnalytics(){
    sAnl(true);
    Promise.all([
      sbGet("daily_stats?order=day.desc&limit=30",tok),
      sbGet("events?select=event,session_id,created_at&order=created_at.desc&limit=500",tok),
      sbGet("profiles?select=id,username,created_at,total_games,xp,level&order=created_at.desc",tok),
      sbGet("scores?select=score,mode,correct_count,total_questions,is_daily,played_at&order=played_at.desc&limit=200",tok)
    ]).then(function(res){
      var daily=res[0]&&!res[0].error&&Array.isArray(res[0])?res[0]:[];
      var events=res[1]&&!res[1].error&&Array.isArray(res[1])?res[1]:[];
      var users=res[2]&&!res[2].error&&Array.isArray(res[2])?res[2]:[];
      var scores=res[3]&&!res[3].error&&Array.isArray(res[3])?res[3]:[];

      // Today's stats
      var today=new Date().toISOString().split("T")[0];
      var todayEvents=events.filter(function(e){return e.created_at&&e.created_at.startsWith(today);});
      var todaySessions=[];
      todayEvents.forEach(function(e){if(e.session_id&&todaySessions.indexOf(e.session_id)===-1)todaySessions.push(e.session_id);});

      // Last 7 days
      var d7=new Date();d7.setDate(d7.getDate()-7);var d7s=d7.toISOString();
      var week=events.filter(function(e){return e.created_at>=d7s;});
      var weekSessions=[];
      week.forEach(function(e){if(e.session_id&&weekSessions.indexOf(e.session_id)===-1)weekSessions.push(e.session_id);});

      // Scores analytics
      var avgScore=0;var totalGames=scores.length;
      if(totalGames>0){var sum=0;scores.forEach(function(s){sum+=s.score;});avgScore=Math.round(sum/totalGames);}
      var modeCount={calibre:0,manufacture:0,haute:0};
      scores.forEach(function(s){if(modeCount[s.mode]!==undefined)modeCount[s.mode]++;});

      sAn({
        daily:daily,
        todayVisitors:todaySessions.length,
        todayGames:todayEvents.filter(function(e){return e.event==="game_end";}).length,
        weekVisitors:weekSessions.length,
        weekGames:week.filter(function(e){return e.event==="game_end";}).length,
        weekSignups:week.filter(function(e){return e.event==="signup";}).length,
        weekShares:week.filter(function(e){return e.event==="share";}).length,
        totalUsers:users.length,
        avgScore:avgScore,
        totalGames:totalGames,
        modeCount:modeCount,
        recentUsers:users.slice(0,10)
      });
      sAnl(false);
    }).catch(function(e){console.log("Analytics failed",e);sAnl(false);});
  }

  function doLogin(){
    if(!le.trim()||!lp.trim())return;
    sLa(true);sLerr(null);
    sbLoginPw(le.trim(),lp.trim()).then(function(res){
      if(res.error){sLerr(res.error_description||res.error.message||"Erreur");sLa(false);return;}
      if(res.access_token&&res.user){
        if(res.user.email!==ADMIN_EMAIL){sLerr("Acc\u00e8s r\u00e9serv\u00e9.");sLa(false);return;}
        sTok(res.access_token);sLerr(null);sLa(false);
        try{localStorage.setItem("hqa_tok",res.access_token);localStorage.setItem("hqa_email",res.user.email);}catch(x){}
        loadData(res.access_token);
      } else {sLerr("Erreur d'authentification");sLa(false);}
    }).catch(function(e){sLerr("Erreur r\u00e9seau");sLa(false);});
  }

  function clearSession(){sTok(null);sLe("");sLp("");sQs([]);sCats([]);try{localStorage.removeItem("hqa_tok");localStorage.removeItem("hqa_email");}catch(x){}}

  function loadData(t){
    var tk=t||tok;
    sLd(true);
    Promise.all([
      sbGet("categories?order=name",tk),
      sbGet("questions?select=id,text,text_en,difficulty,explanation,explanation_en,image_url,active,category_id,categories(name,slug),answers(id,text,text_en,is_correct)&order=created_at.desc",tk)
    ]).then(function(results){
      var c=results[0],q=results[1];
      // Check for auth errors (expired JWT, invalid token)
      if((c&&c.message)||(q&&q.message)||(c&&c.code)||(q&&q.code)){
        console.log("Auth error, clearing session",c,q);
        clearSession();sLd(false);return;
      }
      if(c&&Array.isArray(c)&&c.length>0)sCats(c);
      if(q&&Array.isArray(q)&&!q.error)sQs(q);
      sLd(false);
    }).catch(function(e){console.log("Load failed",e);clearSession();sLd(false);});
  }

  function reload(){
    sbGet("questions?select=id,text,text_en,difficulty,explanation,explanation_en,image_url,active,category_id,categories(name,slug),answers(id,text,text_en,is_correct)&order=created_at.desc",tok).then(function(q){
      if(q&&Array.isArray(q)&&!q.error)sQs(q);
      else if(q&&(q.message||q.code))clearSession();
    });
  }

  function handleImg(e){
    var file=e.target.files&&e.target.files[0];if(!file)return;
    if(file.size>2*1024*1024){showT("Max 2 Mo",true);return;}
    imgFileRef.current=file;
    var r=new FileReader();r.onload=function(ev){sF(function(p){return Object.assign({},p,{imgP:ev.target.result});});};r.readAsDataURL(file);
  }
  function rmImg(){imgFileRef.current=null;sF(function(p){return Object.assign({},p,{imgP:null});});if(fRef.current)fRef.current.value="";}

  function setAns(i,field,val){
    sF(function(p){var ans=p.answers.map(function(a,j){
      if(field==="ok"&&j===i)return Object.assign({},a,{ok:true});
      if(field==="ok"&&j!==i)return Object.assign({},a,{ok:false});
      if(j===i){var u={};u[field]=val;return Object.assign({},a,u);}return a;
    });return Object.assign({},p,{answers:ans});});
  }

  function validate(){
    if(!f.text.trim())return"Question vide";
    if(!f.cat_id)return"Choisissez une cat\u00e9gorie";
    if(f.answers.filter(function(a){return a.t.trim();}).length<2)return"Min. 2 r\u00e9ponses";
    if(!f.answers.some(function(a){return a.ok&&a.t.trim();}))return"Cochez la bonne r\u00e9ponse";
    return null;
  }

  function uploadImg(file){
    var ext=file.name.split(".").pop()||"jpg";
    var name=Date.now()+"_"+Math.random().toString(36).slice(2,8)+"."+ext;
    return fetch(SB_URL+"/storage/v1/object/questions/"+name,{
      method:"POST",
      headers:{"apikey":SB_KEY,"Authorization":"Bearer "+(tok||SB_KEY),"Content-Type":file.type,"x-upsert":"true"},
      body:file
    }).then(function(r){
      if(!r.ok)throw new Error("Upload failed");
      return SB_URL+"/storage/v1/object/public/questions/"+name;
    });
  }

  function submit(){
    var err=validate();if(err){showT(err,true);return;}
    sSv(true);
    var clean=f.answers.filter(function(a){return a.t.trim();});

    var imgPromise;
    var theFile=imgFileRef.current;
    console.log("SUBMIT - imgFile:",theFile,"imgP:",f.imgP?f.imgP.substring(0,50):"null");
    if(theFile){
      console.log("UPLOADING:",theFile.name,theFile.size,theFile.type);
      imgPromise=uploadImg(theFile).then(function(url){
        console.log("UPLOAD OK:",url);
        imgFileRef.current=null;
        return url;
      });
    } else if(f.imgP&&f.imgP.indexOf("supabase")!==-1){
      imgPromise=Promise.resolve(f.imgP);
    } else {
      imgPromise=Promise.resolve(null);
    }

    imgPromise.then(function(imageUrl){
      var qData={text:f.text.trim(),text_en:f.text_en.trim()||null,difficulty:f.diff,category_id:f.cat_id,explanation:f.expl.trim(),explanation_en:f.expl_en.trim()||null,active:f.active,image_url:imageUrl};
      var p;
      if(ei){
        p=sbPatch("questions?id=eq."+ei,qData,tok)
          .then(function(){return sbDel("answers?question_id=eq."+ei,tok);})
          .then(function(){return sbPost("answers",clean.map(function(a){return{question_id:ei,text:a.t.trim(),text_en:a.te.trim()||null,is_correct:a.ok};}),tok);})
          .then(function(){showT("Modifi\u00e9e");});
      } else {
        p=sbPost("questions",qData,tok)
          .then(function(qRes){
            if(qRes&&qRes.length>0){
              return sbPost("answers",clean.map(function(a){return{question_id:qRes[0].id,text:a.t.trim(),text_en:a.te.trim()||null,is_correct:a.ok};}),tok);
            }
          })
          .then(function(){showT("Ajout\u00e9e");});
      }
      p.then(function(){reload();sF(empty());sEi(null);sV("list");sSv(false);})
       .catch(function(e){showT("Erreur: "+e.message,true);sSv(false);});
    }).catch(function(e){showT("Erreur upload: "+e.message,true);sSv(false);});
  }

  function startEdit(q){
    sEi(q.id);
    imgFileRef.current=null;
    var ans=(q.answers||[]).map(function(a){return{t:a.text,te:a.text_en||"",ok:a.is_correct};});
    while(ans.length<4)ans.push({t:"",te:"",ok:false});
    sF({text:q.text,text_en:q.text_en||"",diff:q.difficulty,cat_id:q.category_id||"",expl:q.explanation||"",expl_en:q.explanation_en||"",imgP:q.image_url||null,answers:ans,active:q.active!==false});
    sV("form");
  }

  function toggleActive(q){
    sbPatch("questions?id=eq."+q.id,{active:!q.active},tok).then(function(){reload();});
  }

  function del(id){
    sbDel("answers?question_id=eq."+id,tok)
      .then(function(){return sbDel("questions?id=eq."+id,tok);})
      .then(function(rows){
        if(!rows||rows.length===0){showT("Suppression refus\u00e9e (RLS)",true);return;}
        sCf(null);reload();showT("Supprim\u00e9e");
      })
      .catch(function(e){showT("Erreur: "+e.message,true);});
  }

  function dup(q){
    sbPost("questions",{text:q.text+" (copie)",difficulty:q.difficulty,category_id:q.category_id,explanation:q.explanation,active:true},tok)
      .then(function(qRes){
        if(qRes&&qRes.length>0){
          var newId=qRes[0].id;
          var ans=(q.answers||[]).map(function(a){return{question_id:newId,text:a.text,is_correct:a.is_correct};});
          return sbPost("answers",ans,tok);
        }
      })
      .then(function(){reload();showT("Dupliqu\u00e9e");});
  }

  var filtered=qs.filter(function(q){
    if(fl.cat!=="all"&&q.category_id!==fl.cat)return false;
    if(fl.diff!=="all"&&q.difficulty!==parseInt(fl.diff))return false;
    if(fl.search&&q.text.toLowerCase().indexOf(fl.search.toLowerCase())===-1)return false;
    return true;
  });

  var stats={total:qs.length,on:qs.filter(function(q){return q.active;}).length,img:qs.filter(function(q){return q.image_url;}).length,trad:qs.filter(function(q){return q.text_en;}).length,

    byCat:cats.map(function(c){return{n:c.name,c:qs.filter(function(q){return q.category_id===c.id;}).length};})};

  // Toast

  // Confirm modal
  var cfEl=cf?h("div",{style:{position:"fixed",inset:0,zIndex:150,display:"flex",alignItems:"center",justifyContent:"center",animation:"fadeIn 0.2s"},onClick:function(){sCf(null);}},
    h("div",{style:{position:"absolute",inset:0,background:"rgba(0,0,0,0.2)"}}),
    h("div",{onClick:function(e){e.stopPropagation();},style:{background:C.bg,padding:32,maxWidth:320,width:"90%",border:"1px solid "+C.lt}},
      h("div",{style:{fontSize:18,fontWeight:400,marginBottom:8}},"Supprimer ?"),
      h("div",{style:{fontSize:13,color:C.mid,marginBottom:24}},"Irr\u00e9versible."),
      h("div",{style:{display:"flex",gap:1}},
        h("button",{onClick:function(){sCf(null);},style:{flex:1,padding:"14px 0",background:"transparent",border:"1px solid "+C.lt,borderRadius:0,fontSize:12,cursor:"pointer",fontFamily:font,color:C.mid}},"Annuler"),
        h("button",{onClick:function(){del(cf);},style:{flex:1,padding:"14px 0",background:C.acc,border:"none",borderRadius:0,fontSize:12,cursor:"pointer",fontFamily:font,color:"#fff"}},"Supprimer")))
  ):null;

  // Preview modal
  var pvEl=pvQ?h("div",{style:{position:"fixed",inset:0,zIndex:160,display:"flex",alignItems:"center",justifyContent:"center",animation:"fadeIn 0.2s"},onClick:function(){sPv(null);}},
    h("div",{style:{position:"absolute",inset:0,background:"rgba(0,0,0,0.5)"}}),
    h("div",{onClick:function(e){e.stopPropagation();},style:{background:"#0A0A0A",color:"#F5F5F0",width:"100%",maxWidth:420,maxHeight:"90vh",overflowY:"auto",padding:0,position:"relative"}},
      // Close button
      h("button",{onClick:function(){sPv(null);},style:{position:"absolute",top:12,right:12,width:32,height:32,background:"rgba(255,255,255,0.1)",border:"none",color:"#F5F5F0",fontSize:16,cursor:"pointer",zIndex:2,display:"flex",alignItems:"center",justifyContent:"center"}},"\u2715"),
      // Image
      pvQ.image_url?h("div",{style:{width:"100%",height:200,overflow:"hidden"}},
        h("img",{src:pvQ.image_url,style:{width:"100%",height:"100%",objectFit:"cover"}})):null,
      // Content
      h("div",{style:{padding:"24px 20px"}},
        // Difficulty + category
        h("div",{style:{display:"flex",gap:8,alignItems:"center",marginBottom:12}},
          h("span",{style:{fontSize:12,color:"#8A8A85"}},"\u2605".repeat(pvQ.difficulty||1)),

        // Question text
        h("div",{style:{fontSize:18,fontWeight:400,lineHeight:1.4,marginBottom:4}},pvQ.text),
        pvQ.text_en&&h("div",{style:{fontSize:14,color:"#8A8A85",fontStyle:"italic",marginBottom:16}},pvQ.text_en),
        !pvQ.text_en&&h("div",{style:{height:16}}),
        // Answers
        h("div",{style:{display:"flex",flexDirection:"column",gap:6}},
          (pvQ.answers||[]).map(function(a,i){
            return h("div",{key:i,style:{display:"flex",alignItems:"center",gap:10,padding:"12px 14px",border:"1px solid "+(a.is_correct?"#2D8B46":"rgba(255,255,255,0.1)"),background:a.is_correct?"rgba(45,139,70,0.12)":"transparent"}},

              h("div",null,

          pvQ.explanation&&h("div",{style:{fontSize:13,color:"#ccc",lineHeight:1.5}},pvQ.explanation),
          pvQ.explanation_en&&h("div",{style:{fontSize:12,color:"#8A8A85",marginTop:4,fontStyle:"italic"}},pvQ.explanation_en))))

  // Header
  var navLabels={list:"Liste",form:ei?"Modifier":"Ajouter",stats:"Stats",analytics:"Analytics"};

      h("button",{onClick:loadAnalytics,style:{width:"100%",padding:"14px 0",background:"transparent",border:"1px solid "+C.lt,borderRadius:0,fontSize:12,cursor:"pointer",fontFamily:font,color:C.mid,letterSpacing:"0.08em"}},"Rafra\u00eechir"))
  );

  return h("div",{style:{minHeight:"100vh",background:C.bg,color:C.fg,fontFamily:font}},
    toastEl,cfEl,pvEl,header,
    v==="list"?listView:v==="form"?formView:v==="analytics"?analyticsView:statsView);
}

ReactDOM.render(h(Admin), document.getElementById("root"));
</script>
